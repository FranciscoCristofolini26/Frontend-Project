<section class="habit-empty-state card" aria-label="Nenhum hábito encontrado">
  <span class="habit-empty-state__icon" aria-hidden="true"
    ><mat-icon>self_improvement</mat-icon></span
  >
  <h2>Seu próximo hábito começa aqui</h2>
  <p>Crie um hábito para acompanhar sua consistência e celebrar cada sequência.</p>
  <button type="button" class="button button--primary" (click)="create.emit()">
    <mat-icon>add</mat-icon>Novo hábito
  </button>
</section>
