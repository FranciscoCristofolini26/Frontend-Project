<section class="daily-summary card" aria-labelledby="daily-summary-title">
  <h2 id="daily-summary-title">Resumo do dia</h2>

  <div class="daily-summary__grid">
    @for (metric of metrics(); track metric.id) {
      <article class="daily-summary__metric" [class.daily-summary__metric--highlighted]="metric.highlighted">
        <strong>{{ metric.value }}</strong>
        <span>{{ metric.label }}</span>
      </article>
    }
  </div>
</section>
