<section
  class="planner-day-view card"
  aria-label="Visualização diária"
  [style.--planner-hour-height]="hourHeight() + 'px'"
  [style.--planner-canvas-height]="canvasHeight() + 'px'"
  [style.--planner-event-min-height]="eventMinHeight() + 'px'"
>
  <header class="planner-day-view__header">
    <div>
      <p class="planner-day-view__eyebrow">Visão diária</p>
      <h2 class="planner-day-view__title">{{ dateLabel() }}</h2>
    </div>
    <span class="planner-day-view__hourly-slots">Blocos de 1 hora</span>
  </header>

  <div class="planner-day-view__scroll">
    <div class="planner-day-view__grid">
      <div class="planner-day-view__hours" aria-hidden="true">
        @for (hour of hours; track hour) {
          <span>{{ hour.toString().padStart(2, '0') }}:00</span>
        }
      </div>

      <div class="planner-day-view__canvas" [class.planner-day-view__canvas--drop-enabled]="dragEnabled()">
        <div class="planner-day-view__drop-slots" aria-label="Horários disponíveis para agendamento">
          @for (slot of slots; track slot.startTime) {
            <div
              cdkDropList
              class="planner-day-view__drop-slot"
              [id]="'daily-slot-' + slot.startTime"
              [cdkDropListDisabled]="!dragEnabled()"
              [cdkDropListSortingDisabled]="true"
              (cdkDropListDropped)="dropTask($event, slot.startTime)"
              [attr.aria-label]="'Agendar de ' + slot.startTime + ' a ' + slot.endTime"
            ></div>
          }
        </div>

        @for (event of positionedEvents(); track event.id) {
          <app-planner-event-card
            [event]="event"
            [style.top.px]="eventTop(event)"
            [style.height.px]="eventHeight(event)"
            [style.left.%]="eventLeft(event)"
            [style.width.%]="eventWidth(event)"
            (remove)="eventRemoved.emit($event)"
            (edit)="eventEdited.emit($event)"
          />
        }
      </div>
    </div>
  </div>
</section>
